<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="75%" cy="20%" r="50%">
      <stop offset="0%" stop-color="rgba(78,168,222,0.18)"/>
      <stop offset="100%" stop-color="rgba(78,168,222,0)"/>
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&amp;display=swap');
    </style>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#08101F"/>
  <!-- Glow -->
  <circle cx="420" cy="80" r="180" fill="url(#glow)"/>
  <!-- knop text -->
  <text x="256" y="320"
    font-family="'Playfair Display', Georgia, serif"
    font-style="italic"
    font-weight="700"
    font-size="188"
    text-anchor="middle"
    fill="#ffffff"
    letter-spacing="-6">knop</text>
  <!-- Blue dot -->
  <text x="415" y="320"
    font-family="'Playfair Display', Georgia, serif"
    font-style="normal"
    font-weight="700"
    font-size="188"
    text-anchor="middle"
    fill="#7EC8F0">.</text>
</svg>
